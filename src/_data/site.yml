# Site-wide values (available in templates as `site`): the only place for the site name and the public
# contact address. Keys are set by the frontend; values come from the team or from the repository only.
name: "Fostering Research Synergies"
short_name: "FRS"
# The team's one-line description, from the previous home page: the home masthead, and the meta and
# Open Graph description of the home.
description: "An informal association of PhD students and postdoctoral researchers fostering collaboration and knowledge exchange through workshops and conferences."
# Public contact address, already on the site (contact page, Lucca 2025 page). docs/ROADMAP.md, domanda 9.
email: "frscrefimt@gmail.com"
# Canonical address of the site, without the final slash (docs/ROADMAP.md, D3).
url: "https://fosteringresearchsynergies.github.io"
# The institutions of the organizers (CLAUDE.md), with their official logos: CSH and IMT as the SVG files of
# their websites, CREF as the PNG of its website (no SVG published), downloaded on 5 November 2026 at the
# organizer's request. Shown by the include institutions.njk; width and height are the files' own.
institutions:
  - name: "Centro Ricerche Enrico Fermi (CREF)"
    url: "https://www.cref.it/"
    logo: "/assets/images/logos/cref.png"
    width: 366
    height: 84
  - name: "IMT School for Advanced Studies Lucca"
    url: "https://www.imtlucca.it/"
    logo: "/assets/images/logos/imt-lucca.svg"
    width: 164
    height: 80
  - name: "Complexity Science Hub (CSH)"
    url: "https://csh.ac.at/"
    logo: "/assets/images/logos/csh.svg"
    width: 300
    height: 83
